# EcoFlow NUT bridge configuration.
# Copy to config.yaml and edit for your device.

ecoflow:
  # BLE MAC address of your power station (find it with: ecoflow-nut scan).
  mac: "AA:BB:CC:DD:EE:FF"
  # Serial number, printed on the unit / shown in the EcoFlow app.
  serial: "R351XXXXXXXXXXXX"

  # Which protocol the device speaks. EcoFlow ships two incompatible
  # generations, so this must match the hardware:
  #
  #   delta2max  DELTA 2 Max / E2000 (2048 Wh / 2400 W), serial R351/R354/E201
  #   delta2     DELTA 2 (R331/R335), DELTA 2 Black (R701), DELTA 3 1500 (D361/D365)
  #   delta3     DELTA 3 / DELTA 3 Plus / River 3 (P231…), BLE EF-D3…
  #   raw        connect and capture only, for a device you cannot identify yet
  #
  # Spelling is forgiving ("DELTA 2 Max", "delta-2-max", "e2000" and the serial
  # prefix all work). Selection is by THIS setting, not by sniffing the serial
  # number, so a regional or newer revision whose prefix nothing recognises
  # still works -- just name the generation it belongs to.
  model: "delta2max"
  # How often the bridge checks the BLE link is still alive -- a watchdog, NOT a
  # sample rate. Devices push telemetry on their own schedule and cannot be
  # asked to send faster; lowering this only shortens how long a dropped link
  # goes unnoticed. For chart resolution see sqlite.min_interval_seconds, and
  # for how often the NUT file is rewritten see nut.min_write_interval_seconds.
  poll_interval_seconds: 5

  # Encryption handshake. "auto" reads the type from the BLE advertisement.
  # Modern units use the encrypted ECDH handshake (type 7), which needs a
  # one-time EcoFlow account user_id (see README "Authentication"). This is used
  # ONLY to derive the local BLE session secret -- no telemetry goes via cloud.
  encrypt_type: "auto"
  user_id: ""   # required for encrypt_type 7; obtain once via the EcoFlow API

  # Frame version for control + authentication. Leave unset to use the model
  # default (2 for the DELTA 2 generation, 3 for the DELTA 3). Send the wrong
  # one and the device DROPS THE CONNECTION during authentication instead of
  # replying -- "connected, then disconnected" is that signature, and a longer
  # timeout will not help. Run 'ecoflow-nut probe' to find the right value.
  # packet_version: 3

ble:
  adapter: "hci0"
  connect_timeout_seconds: 30
  reconnect_backoff_max_seconds: 60
  scan_timeout_seconds: 30

nut:
  device_name: "ecoflow"
  dev_file_path: "/var/run/nut/ecoflow.dev"
  # Rated pack capacity and AC output for YOUR model -- these drive the runtime
  # estimate and ups.load. DELTA 2 Max: 2048 / 2400. DELTA 2: 1024 / 1800.
  # DELTA 3: 1024 / 1800.
  battery_capacity_wh: 2048
  realpower_nominal: 2400
  battery_warning_percent: 35
  battery_runtime_low_seconds: 300
  battery_type: "LiFePO4"
  battery_voltage_nominal: 51.2
  input_transfer_low: 200
  input_transfer_high: 250
  # Fallback "mains present" rule for models that do not measure input voltage
  # (the DELTA 3): AC counts as present only above this many watts of draw.
  ac_input_present_min_watts: 10
  # Minimum seconds between rewrites of the dummy-ups state file. The DELTA 2
  # generation streams several subsystem heartbeats per second, and rewriting
  # on each is pure waste -- NUT's dummy-ups driver re-reads at ups.conf's
  # pollinterval (2s). A status change is ALWAYS published immediately, so an
  # outage is never delayed by this.
  min_write_interval_seconds: 2
  # Preferred rule where the device does measure it (the DELTA 2 generation):
  # mains are present above this many volts. Unlike watts this stays true on a
  # full battery with an idle load, so it will not report a false outage.
  ac_input_present_min_volts: 50
  thresholds:
    low_battery_percent: 25       # triggers OB LB
    critical_battery_percent: 10  # reserved for future auto-cut logic
  static_values:
    input_voltage: 230
    input_frequency: 50
    output_voltage: 230
    output_frequency: 50
    manufacturer: "EcoFlow"
    model: "DELTA 2 Max"
    serial: "R351XXXXXXXXXXXX"

logging:
  level: "INFO"
  format: "json"   # or "console"

# Local control socket. The running daemon listens here so the CLI (and the
# auto-shutdown logic) can send output commands over the daemon's existing BLE
# connection, without stopping the bridge. Must be writable by the service user.
control_socket_path: "/var/run/nut/ecoflow-nut.sock"

# Optional embedded web UI (control + telemetry dashboard). DISABLED by default.
# Runs inside the daemon, so it shares the single BLE connection: the dashboard
# shows live values and control actions go out over the existing link.
# Requires the [web] extra:  pip install ecoflow-nut-bridge[web]
web:
  enabled: false
  host: "0.0.0.0"            # bind address (0.0.0.0 = reachable on the LAN)
  port: 8080
  # Shared secret required for control actions (toggling outputs / auto-shutdown).
  # Leave empty to keep the dashboard read-only. Prefer the ECOFLOW_WEB_TOKEN env
  # var over putting the secret in this file.
  auth_token: ""
  require_auth_for_read: false   # also require the token to view telemetry

# Telemetry history for the web UI's charts. Two backends, both DISABLED by
# default; pick ONE (if both are on, Postgres wins).

# Option A -- Local SQLite. 100% on this host, no server and no extra Python
# dependency (stdlib sqlite3). Best when the bridge should be self-contained
# (e.g. a Raspberry Pi). Just enable it; nothing else to install.
sqlite:
  enabled: false
  path: "/var/lib/ecoflow-nut/telemetry.db"   # persistent file (NOT /var/run)
  table: "ecoflow_samples"
  # Minimum seconds between persisted rows, and the main control over how
  # detailed the dashboard's charts are. Lower = finer charts but more SD-card
  # writes and a bigger file (roughly: 10s ~= 115 MB over 90 days, 5s ~= 230 MB,
  # 0 = every frame the device sends). Editable live from the web UI.
  min_interval_seconds: 10
  retention_days: 90        # auto-prune rows older than this (0 = keep forever)

# Option B -- Postgres. For a central/remote database server. Requires the
# [postgres] extra: pip install ecoflow-nut-bridge[postgres]
postgres:
  enabled: false
  # Connection string. Prefer the ECOFLOW_PG_DSN env var over this file.
  dsn: ""                   # e.g. postgresql://ecoflow:secret@unraid-host:5432/ecoflow
  table: "ecoflow_samples"
  min_interval_seconds: 0   # min seconds between persisted rows (0 = every frame)
  retention_days: 0         # auto-prune rows older than this (0 = keep forever)

# Electricity pricing for the web UI's cost estimate. Heures Creuses (off-peak)
# vs Heures Pleines (peak). Cost is metered against AC INPUT (grid draw). All of
# these are also editable live from the web UI's Settings panel (and persisted).
pricing:
  enabled: false            # show cost figures in the dashboard
  currency: "€"
  hc_start: "22:00"         # off-peak window start (may wrap midnight)
  hc_end: "06:00"           # off-peak window end; all other hours are HP
  price_hc: 0.0             # off-peak price per kWh
  price_hp: 0.0             # peak price per kWh

# Where the web UI persists live-edited settings (overlaid on this file at
# startup). Lives in the systemd StateDirectory so it survives restarts.
settings_file: "/var/lib/ecoflow-nut/settings.json"

# Optional auto-shutdown: cut the power station's output when the battery is
# critically low while on battery. DISABLED by default -- cutting output is
# destructive.
# The grace period lets NUT clients (Unraid/Synology) finish their own shutdown,
# triggered by the OB LB status, before the inverter is cut.
auto_shutdown:
  enabled: false
  trigger_soc_percent: 10        # arm + cut at/below this SoC (on battery only)
  recover_soc_percent: 15        # "recovered" SoC: disarms the SoC trigger, and
                                 # gates RESTORE -- after a cut, output is turned
                                 # back on only once SoC climbs back to this (so
                                 # there's buffer to shut down again), even on AC.
  grace_period_seconds: 300      # wait this long after arming before cutting
  # Low-load trigger: when on battery and AC output stays at/below this many
  # watts for load_grace_seconds, cut AC (the protected gear has powered off).
  # Applies at any SoC. Leave null/omit to disable. Example: 15
  min_load_watts: null
  load_grace_seconds: 60
  cut_ac: true                   # turn off AC output
  cut_usb: false                 # KEEP false if the bridge host is USB-powered
  cut_dc: false                  # turn off 12V DC output
  cut_eve: false                 # also cut the downstream HomeKit outlet (see 'eve')
  # Before cutting the Eve outlet, read the outlet's OWN power draw and wait
  # until it is really idle -- i.e. the server has finished shutting down rather
  # than merely looking quiet on the DELTA 3's total AC draw. Needs an Eve that
  # reports watts: check with 'ecoflow-nut eve status --all' (look for a readable
  # e863f10d-... characteristic) and read the real running/idle figures there, so
  # you can set this between them. A powered-down server's PSU standby is
  # typically 1-3 W. null = off (cut immediately).
  eve_confirm_idle_watts: null   # e.g. 5
  eve_confirm_poll_seconds: 15   # seconds between readings while waiting
  eve_confirm_samples: 2         # consecutive idle readings needed
  # null = wait indefinitely rather than cut a load that is still drawing. Safest
  # for the server, but if the outlet is unreachable nothing is ever shed and the
  # battery drains to 0 (where the server loses power uncleanly anyway). Set a
  # number of seconds to cut regardless after that long.
  eve_confirm_timeout_seconds: null
  restore_on_recovery: false     # turn outputs back on when power/SoC recovers

# Optional downstream HomeKit-over-BLE outlet (e.g. an Eve Energy, BLE/non-Thread).
# DISABLED by default. Lets a SINGLE load (e.g. an Unraid server) be shed on
# critical battery while the station's other AC sockets (router / fibre ONT) stay
# powered -- the EcoFlow AC toggle is all-or-nothing, this gives per-load control.
# Requires the [eve] extra:  pip install ecoflow-nut-bridge[eve]
#
# One-time setup (the bridge becomes the outlet's sole HomeKit controller):
#   1. Reset the outlet and remove it from Apple Home (HAP pairs to ONE controller).
#   2. ecoflow-nut eve discover         # find its device_id
#   3. set device_id + setup_code below, then: ecoflow-nut eve pair
#   4. set cut_eve: true above (and usually cut_ac: false to keep the bank live).
eve:
  enabled: false
  device_id: ""                 # HomeKit accessory id (from 'eve discover')
  # Prefer a SEPARATE BT dongle from the EcoFlow link to avoid stalling telemetry.
  adapter: "hci1"
  pairing_file: "/var/lib/ecoflow-nut/eve-pairing.json"
  setup_code: ""                # 8-digit HomeKit code, e.g. "123-45-678" (pairing only)
  connect_timeout_seconds: 30
  # Read the outlet's real state this often. Without it the tile can only
  # show what the bridge last commanded -- blank after a restart, wrong the
  # moment you use the outlet's own button. Each poll is a short BLE
  # connection, so raise it on a shared adapter; 0 turns polling off.
  poll_interval_seconds: 60

# Optional SwitchBot Bot (mechanical button pusher) for the server's power button.
# DISABLED by default. Plain BLE, no pairing. MANUAL ONLY -- exposed on the CLI
# ('ecoflow-nut switchbot press') and the web dashboard; it is NOT tied to
# auto-shutdown (a power button is a toggle, so an automated press could shut down
# a server that already auto-booted). Find the MAC with 'switchbot scan'.
switchbot:
  enabled: false
  mac: ""                       # BLE MAC of the Bot (from 'switchbot scan')
  adapter: "hci0"               # on-demand connect; brief blip on a shared radio
  connect_timeout_seconds: 20
