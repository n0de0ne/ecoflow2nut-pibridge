# EcoFlow E2000 (2048 Wh / 2400 W) NUT bridge configuration.
#
# The E2000 speaks the DELTA 2 Max protocol -- confirmed on hardware, not
# inferred: it authenticates with V2 framing and its PD heartbeat is exactly
# 137 bytes, PD_DELTA2_MAX's size. Only its serial prefix (E201) is new, which
# is why integrations that whitelist serial prefixes call it "unsupported".
#
# Copy to config/config.yaml (gitignored) and fill in your own values.

ecoflow:
  mac: "AA:BB:CC:DD:EE:FF"          # from 'ecoflow-nut scan'
  serial: "E201XXXXXXXXXXXX"        # FULL serial; auth hashes user_id + serial
  user_id: ""                       # EcoFlow account id, required for encrypt_type 7
  model: "e2000"                    # -> the delta2max driver (V2 framing)
  poll_interval_seconds: 5
  encrypt_type: "auto"              # the E2000 advertises type 7

ble:
  adapter: "hci0"
  connect_timeout_seconds: 30
  reconnect_backoff_max_seconds: 60
  scan_timeout_seconds: 30

nut:
  device_name: "ecoflow"
  dev_file_path: "/var/run/nut/ecoflow.dev"
  battery_capacity_wh: 2048         # E2000 nameplate
  realpower_nominal: 2400           # E2000 nameplate
  battery_warning_percent: 35
  battery_runtime_low_seconds: 300
  battery_type: "LiFePO4"
  battery_voltage_nominal: 51.2
  input_transfer_low: 200
  input_transfer_high: 250
  ac_input_present_min_watts: 10
  # The DELTA 2 generation measures mains voltage, so this is what decides
  # OL vs OB -- it stays at nominal on a full battery with an idle load, where
  # a watts-only rule would report a false outage.
  ac_input_present_min_volts: 50
  thresholds:
    low_battery_percent: 25
    critical_battery_percent: 10
  static_values:
    input_voltage: 230
    input_frequency: 50
    output_voltage: 230
    output_frequency: 50
    manufacturer: "EcoFlow"
    model: "E2000"
    serial: "E201XXXXXXXXXXXX"

logging:
  level: "INFO"
  format: "json"

control_socket_path: "/var/run/nut/ecoflow-nut.sock"
settings_file: "/var/lib/ecoflow-nut/settings.json"

# Web dashboard (live telemetry + control). Set enabled: true and restart, then
# open http://<pi-ip>:8080. aiohttp is already installed by systemd/install.sh.
#
# auth_token is what turns the control buttons on. Leave it empty and the
# dashboard is read-only -- it will say so under the port controls -- because
# anything that can cut your AC bank should need a secret. Generate one with
#   openssl rand -hex 16
# and prefer the ECOFLOW_WEB_TOKEN env var (a systemd drop-in) over this file,
# which is world-readable in /etc.
web:
  enabled: false
  host: "0.0.0.0"
  port: 8080
  auth_token: ""
  require_auth_for_read: false

# Local telemetry history, for the dashboard's charts. Self-contained (stdlib
# sqlite3), so nothing extra to install. min_interval_seconds throttles rows
# independently of the poll rate -- keep it well above 0 on an SD card.
sqlite:
  enabled: false
  path: "/var/lib/ecoflow-nut/telemetry.db"
  table: "ecoflow_samples"
  min_interval_seconds: 30
  retention_days: 90

# Cutting output is destructive; opt in deliberately. KEEP cut_usb false if the
# Pi is powered from the station's USB port.
auto_shutdown:
  enabled: false
  trigger_soc_percent: 10
  recover_soc_percent: 15
  grace_period_seconds: 300
  cut_ac: true
  cut_usb: false
  cut_dc: false
  restore_on_recovery: false

# Optional downstream HomeKit-over-BLE outlet (e.g. an Eve Energy). Lets the
# bridge cut ONE load -- a server, say -- while the E2000's other AC sockets
# stay powered, which its own all-or-nothing AC bank cannot do. Enabling this
# adds the outlet's On/Off tile to the dashboard.
#
# Pair it once before enabling (reset the outlet and remove it from Apple Home
# first -- the bridge becomes its sole controller):
#   ecoflow-nut --config config.yaml eve discover   # -> device_id
#   ecoflow-nut --config config.yaml eve pair       # -> writes pairing_file
#
# adapter: prefer a SECOND BT dongle. The E2000 link is persistent and its
# watchdog reconnects on a stall, so an Eve toggle sharing hci0 can cost you
# telemetry. If you only have one radio, hci0 works -- expect a brief blip.
eve:
  enabled: false
  device_id: ""                 # HomeKit accessory id (from 'eve discover')
  adapter: "hci1"
  pairing_file: "/var/lib/ecoflow-nut/eve-pairing.json"
  setup_code: ""                # 8-digit HomeKit code, e.g. "123-45-678" (pairing only)
  connect_timeout_seconds: 30

# Optional SwitchBot Bot (mechanical button pusher) for a server's power button.
# MANUAL ONLY -- it adds a "Press" button to the dashboard and is deliberately
# NOT wired to auto-shutdown, since a power button is a toggle and an automated
# press could shut down a server that had already booted back up.
switchbot:
  enabled: false
  mac: ""                       # BLE MAC of the Bot (from 'switchbot scan')
  adapter: "hci0"               # on-demand connect; brief blip on a shared radio
  connect_timeout_seconds: 20
